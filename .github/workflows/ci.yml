name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_call: # dipakai release.yml: tag tidak dirilis bila CI gagal
  schedule: [{ cron: "0 2 * * 1" }] # Senin: dependency baru bisa kena CVE tanpa ada commit
permissions: { contents: read, pull-requests: read } # pull-requests: dibutuhkan gitleaks-action

jobs:
  backend:
    runs-on: ubuntu-latest
    services: # Redis (test cache) + Postgres (test integrasi); di CI test gagal, bukan skip, bila tidak tersedia
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env: { TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/test?sslmode=disable" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: DB_URL="$TEST_DATABASE_URL" go run ./cmd/migration up
      - run: make vet test
      - run: go test -tags integration -p 1 -count=1 ./internal/app/api/cart/
      - run: make sec

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  docker:
    needs: [backend, frontend, secrets] # jangan build bila ada yang gagal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build backend # pastikan Dockerfile Railway valid tanpa Docker lokal
